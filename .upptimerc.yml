# État du service Place de la mairie (E29-02) : surveillance extérieure, au plus toutes les deux heures, et page de
# statut publique sur status.place-de-la-mairie.fr. Une commune s'ajoute ici à sa mise en ligne.
owner: dharmachose
repo: statut

# Les sondes passent par .github/workflows/sonde-minute-0.yml, à la minute 1 d'une heure paire de Paris, quand les
# tâches du site viennent de réveiller la base et le conteneur. Les passages d'Upptime lui-même tombent à n'importe
# quelle minute et réveilleraient tout pour eux seuls : un par an. À ne pas retirer : Upptime réécrit
# .github/workflows d'après ce réglage, et ses défauts sont de 5 minutes pour la sonde et d'un jour pour le temps de
# réponse.
workflowSchedule:
  uptime: "0 23 1 1 *"
  responseTime: "0 23 1 1 *"

sites:
  - name: Service (serveur et base de données)
    url: https://saint-jean-de-chevelu.place-de-la-mairie.fr/api/sante
  - name: Saint-Jean-de-Chevelu
    url: https://saint-jean-de-chevelu.place-de-la-mairie.fr

# Une panne ouvre une fiche assignée au responsable du service : il est prévenu par e-mail par GitHub.
assignees:
  - dharmachose

status-website:
  cname: status.place-de-la-mairie.fr
  name: État du service · Place de la mairie
  introTitle: "**État du service** Place de la mairie"
  introMessage: Disponibilité des sites des communes, vérifiée au plus toutes les deux heures depuis l’extérieur de l’hébergeur. Les incidents et leur résolution s’affichent ci-dessous.
  navbar:
    - title: État du service
      href: /
    - title: Place de la mairie
      href: https://place-de-la-mairie.fr

i18n:
  activeIncidents: Incidents en cours
  allSystemsOperational: Tous les services fonctionnent
  incidentReport: "Incident n° $NUMBER →"
  pastIncidents: Incidents passés
  pastIncidentsResolved: "Résolu en $MINUTES minutes, $POSTS publication(s)"
  liveStatus: État en direct
  overallUptime: "Disponibilité globale : $UPTIME"
  overallUptimeTitle: Disponibilité globale
  averageResponseTime: "Temps de réponse moyen : $TIME ms"
  averageResponseTimeTitle: Temps de réponse moyen
  up: Fonctionne
  down: En panne
  degraded: Ralenti
  ms: ms
  loading: Chargement
  navGitHub: GitHub
  footer: Page publiée avec Upptime, logiciel libre.
